[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech_rl"
version = "0.1.0"
description = "Reproducible RL environment for financial statement auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.4",
    "numpy==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
